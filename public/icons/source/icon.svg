<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c96b41" />
      <stop offset="100%" stop-color="#a6512f" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)" />

  <!-- dove-in-flight silhouette -->
  <g fill="#f7ecd9" stroke="#6b3f27" stroke-width="4" stroke-linejoin="round">
    <!-- left wing -->
    <path d="M256,270 C190,235 120,215 60,235 C110,255 150,275 190,300 C215,290 238,280 256,270 Z" />
    <!-- right wing -->
    <path d="M256,270 C322,235 392,215 452,235 C402,255 362,275 322,300 C297,290 274,280 256,270 Z" />
    <!-- body -->
    <ellipse cx="256" cy="300" rx="34" ry="52" />
    <!-- head -->
    <circle cx="256" cy="228" r="27" />
    <!-- tail -->
    <path d="M244,346 L256,392 L268,346 Z" />
  </g>
  <!-- beak -->
  <path d="M280,222 L306,230 L280,240 Z" fill="#e08a4c" />
  <!-- eye -->
  <circle cx="264" cy="222" r="4.5" fill="#3a2f22" />
</svg>
